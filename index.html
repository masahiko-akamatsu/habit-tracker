<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>習慣リスト｜My Habits</title>

<!-- SheetJS (Excel出力) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FBF7F0;
    --paper:#FFFFFF;
    --ink:#3D3733;
    --ink-soft:#8C8278;
    --line:#EDE6DB;

    --morning:#E8A87C;  --morning-bg:#FCEFE2;
    --noon:#E9B949;     --noon-bg:#FBF2D6;
    --night:#6B73A8;    --night-bg:#E9EBF4;
    --weekly:#7FA876;   --weekly-bg:#E8F0E5;
    --monthly:#C77D92;  --monthly-bg:#F7E7EC;
    --yearly:#9B7BB0;   --yearly-bg:#EFE7F4;

    --shadow:0 8px 30px rgba(61,55,51,.08);
    --radius:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Zen Kaku Gothic New",sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, #FDEFD9 0%, transparent 55%),
      radial-gradient(900px 500px at -10% 110%, #EFE7F4 0%, transparent 50%),
      var(--bg);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:"Zen Maru Gothic",sans-serif;}

  /* ---------- ログイン画面 ---------- */
  #authView{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .auth-card{
    background:var(--paper);width:100%;max-width:420px;border-radius:28px;
    padding:40px 32px;box-shadow:var(--shadow);border:1px solid var(--line);
  }
  .auth-logo{font-size:44px;text-align:center;margin-bottom:6px;}
  .auth-card h1{font-family:"Zen Maru Gothic";font-weight:900;font-size:24px;text-align:center;letter-spacing:.04em;}
  .auth-sub{text-align:center;color:var(--ink-soft);font-size:13px;margin:8px 0 26px;line-height:1.7;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:700;letter-spacing:.05em;}
  .field input{
    width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;
    font-size:15px;font-family:inherit;background:#FCFAF6;transition:.2s;
  }
  .field input:focus{outline:none;border-color:var(--morning);background:#fff;}
  .btn{
    width:100%;padding:14px;border:none;border-radius:14px;font-family:"Zen Maru Gothic";
    font-weight:700;font-size:15px;cursor:pointer;transition:.2s;letter-spacing:.05em;
  }
  .btn-primary{background:linear-gradient(135deg,#E8A87C,#C77D92);color:#fff;box-shadow:0 6px 16px rgba(199,125,146,.3);}
  .btn-primary:hover{transform:translateY(-1px);filter:brightness(1.03);}
  .btn-primary:disabled{opacity:.6;cursor:default;transform:none;}
  .auth-switch{text-align:center;margin-top:18px;font-size:13px;color:var(--ink-soft);}
  .auth-switch a{color:var(--monthly);font-weight:700;text-decoration:none;cursor:pointer;}
  .auth-forgot{text-align:center;margin-top:12px;font-size:13px;}
  .auth-forgot a{color:var(--ink-soft);text-decoration:underline;cursor:pointer;}
  .auth-msg{font-size:13px;text-align:center;margin-top:14px;min-height:18px;line-height:1.6;}
  .auth-msg.err{color:#C0594F;}
  .auth-msg.ok{color:#7FA876;}
  .config-warn{
    background:#FBF2D6;border:1px solid #E9B949;color:#8a6d1a;border-radius:14px;
    padding:12px 14px;font-size:12px;line-height:1.7;margin-bottom:20px;
  }

  /* ---------- ヘッダー ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:rgba(251,247,240,.82);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .head-inner{max-width:960px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px;}
  .head-title{font-family:"Zen Maru Gothic";font-weight:900;font-size:19px;display:flex;align-items:center;gap:8px;}
  .head-spacer{flex:1;}
  .user-chip{font-size:12px;color:var(--ink-soft);background:#fff;border:1px solid var(--line);padding:7px 12px;border-radius:999px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink-soft);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;font-family:"Zen Maru Gothic";transition:.2s;white-space:nowrap;}
  .btn-ghost:hover{border-color:var(--morning);color:var(--ink);}
  .btn-excel{background:linear-gradient(135deg,#7FA876,#5f9156);color:#fff;border:none;box-shadow:0 4px 12px rgba(127,168,118,.3);}
  .btn-excel:hover{color:#fff;filter:brightness(1.05);}

  /* ---------- メイン ---------- */
  main{max-width:960px;margin:0 auto;padding:26px 20px 80px;}
  .intro{margin:6px 4px 22px;color:var(--ink-soft);font-size:13px;line-height:1.8;}

  .group-label{
    font-family:"Zen Maru Gothic";font-weight:700;font-size:13px;color:var(--ink-soft);
    letter-spacing:.12em;margin:30px 4px 12px;display:flex;align-items:center;gap:10px;
  }
  .group-label::after{content:"";flex:1;height:1px;background:var(--line);}
  .first-group{margin-top:6px;}

  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  @media(max-width:760px){.cards{grid-template-columns:1fr;}}

  .card{
    background:var(--paper);border-radius:var(--radius);padding:20px 18px;
    box-shadow:var(--shadow);border:1px solid var(--line);position:relative;
    border-top:4px solid var(--c);
  }
  .card-head{display:flex;align-items:center;gap:9px;margin-bottom:14px;}
  .card-emoji{
    width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
    font-size:20px;background:var(--c-bg);
  }
  .card-title{font-family:"Zen Maru Gothic";font-weight:700;font-size:16px;}
  .card-count{font-size:11px;color:var(--ink-soft);margin-left:auto;background:var(--c-bg);color:var(--c);padding:3px 9px;border-radius:999px;font-weight:700;}

  .habit-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;min-height:8px;}
  .habit{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;
    background:#FCFAF6;border:1px solid var(--line);transition:.15s;
  }
  .habit:hover{border-color:var(--c);}
  .check{
    width:22px;height:22px;border-radius:7px;border:2px solid var(--c);flex-shrink:0;
    cursor:pointer;display:grid;place-items:center;transition:.15s;background:#fff;
  }
  .check.on{background:var(--c);}
  .check.on::after{content:"✓";color:#fff;font-size:13px;font-weight:900;}
  .habit-text{flex:1;font-size:14px;border:none;background:transparent;font-family:inherit;color:var(--ink);padding:2px 0;}
  .habit-text:focus{outline:none;}
  .habit.done .habit-text{text-decoration:line-through;color:var(--ink-soft);}
  .del{background:none;border:none;color:#D9CFC2;cursor:pointer;font-size:17px;line-height:1;padding:2px 4px;transition:.15s;flex-shrink:0;}
  .del:hover{color:#C0594F;}
  .drag-handle{cursor:grab;color:#B8AE9F;font-size:18px;line-height:1;padding:4px 5px;flex-shrink:0;touch-action:none;user-select:none;-webkit-user-select:none;}
  .drag-handle:hover{color:var(--c);}
  .drag-handle:active{cursor:grabbing;}
  .habit.dragging{opacity:.55;background:var(--c-bg);border-color:var(--c);}
  .move-col{display:flex;flex-direction:column;gap:1px;flex-shrink:0;}
  .move{background:none;border:none;color:#C9BFB2;cursor:pointer;font-size:10px;line-height:1;padding:1px 3px;transition:.15s;}
  .move:hover:not(:disabled){color:var(--c);}
  .move:disabled{opacity:.25;cursor:default;}
  .empty{font-size:12px;color:#C9BFB2;text-align:center;padding:6px 0;}

  .add-row{display:flex;gap:8px;}
  .add-input{
    flex:1;padding:10px 12px;border:1.5px dashed var(--line);border-radius:12px;
    font-size:13px;font-family:inherit;background:transparent;transition:.2s;
  }
  .add-input:focus{outline:none;border-color:var(--c);border-style:solid;background:#fff;}
  .add-btn{
    border:none;background:var(--c-bg);color:var(--c);width:42px;border-radius:12px;
    font-size:20px;cursor:pointer;font-weight:700;transition:.15s;
  }
  .add-btn:hover{background:var(--c);color:#fff;}

  .save-dot{font-size:11px;color:var(--ink-soft);margin-left:6px;transition:.3s;opacity:0;}
  .save-dot.show{opacity:1;}
  .hidden{display:none!important;}
</style>
</head>
<body>

<!-- ===================== ログイン画面 ===================== -->
<div id="authView">
  <div class="auth-card">
    <div class="auth-logo">🌱</div>
    <h1 class="display">習慣リスト</h1>
    <p class="auth-sub">朝・昼・夜の習慣から、週・月・年の習慣まで。<br>あなたの毎日を、やさしく見える化しましょう。</p>

    <div id="configWarn" class="config-warn hidden">
      ⚠️ Firebase の設定がまだです。ファイル内の <b>firebaseConfig</b> に、ご自身のプロジェクト情報を貼り付けてください。
    </div>

    <div class="field">
      <label>メールアドレス</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="username" />
    </div>
    <div class="field">
      <label>パスワード</label>
      <input id="password" type="password" placeholder="6文字以上" autocomplete="current-password" />
    </div>
    <button id="submitBtn" class="btn btn-primary">ログイン</button>
    <div id="authMsg" class="auth-msg"></div>
    <div id="forgotRow" class="auth-forgot"><a id="forgotLink">パスワードをお忘れですか？</a></div>
    <div class="auth-switch">
      <span id="switchText">アカウントをお持ちでない方は </span>
      <a id="switchLink">新規登録</a>
    </div>
  </div>
</div>

<!-- ===================== メインアプリ ===================== -->
<div id="appView" class="hidden">
  <header>
    <div class="head-inner">
      <div class="head-title display">🌱 習慣リスト</div>
      <span id="saveDot" class="save-dot">保存しました</span>
      <div class="head-spacer"></div>
      <span id="userChip" class="user-chip"></span>
      <button id="excelBtn" class="btn-ghost btn-excel">⬇ Excel出力</button>
      <button id="logoutBtn" class="btn-ghost">ログアウト</button>
    </div>
  </header>

  <main>
    <p class="intro">習慣を入力すると自動で保存されます。チェックは「今日やった／達成した」しるしに。お好きにお使いください。</p>
    <div id="boards"></div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============================================================
   ① ここにご自身の Firebase プロジェクトの設定を貼り付けてください
   （Firebaseコンソール → プロジェクトの設定 → マイアプリ → SDK設定）
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBW0IhH43FOiNEoAbL85OronUWvKmIlNBg",
  authDomain: "habit-tracker-45130.firebaseapp.com",
  projectId: "habit-tracker-45130",
  storageBucket: "habit-tracker-45130.firebasestorage.app",
  messagingSenderId: "944017463774",
  appId: "1:944017463774:web:5663fd10b0ec2afbd5a54f"
};

/* ---- カテゴリー定義（朝・昼・夜＜1日／週間／月間／年間） ---- */
const CATEGORIES = [
  { key:"morning", group:"1日の習慣", label:"朝の習慣", emoji:"🌅", color:"--morning", bg:"--morning-bg" },
  { key:"noon",    group:"1日の習慣", label:"昼の習慣", emoji:"☀️", color:"--noon",    bg:"--noon-bg" },
  { key:"night",   group:"1日の習慣", label:"夜の習慣", emoji:"🌙", color:"--night",   bg:"--night-bg" },
  { key:"weekly",  group:"週間の習慣", label:"週間の習慣", emoji:"📅", color:"--weekly", bg:"--weekly-bg" },
  { key:"monthly", group:"月間の習慣", label:"月間の習慣", emoji:"🗓️", color:"--monthly",bg:"--monthly-bg" },
  { key:"yearly",  group:"年間の習慣", label:"年間の習慣", emoji:"🎯", color:"--yearly", bg:"--yearly-bg" },
];

/* ---- 初期状態：すべて白紙 ---- */
function blankData(){
  const d = {};
  CATEGORIES.forEach(c => d[c.key] = []);
  return d;
}

let app, auth, db;
let configOK = !firebaseConfig.apiKey.startsWith("YOUR_");

if (configOK) {
  app  = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db   = getFirestore(app);
} else {
  document.getElementById("configWarn").classList.remove("hidden");
}

/* ============================================================
   認証画面のロジック
   ============================================================ */
let mode = "login"; // login | signup
const $ = id => document.getElementById(id);

$("switchLink").addEventListener("click", () => {
  mode = mode === "login" ? "signup" : "login";
  if (mode === "signup") {
    $("submitBtn").textContent = "新規登録する";
    $("switchText").textContent = "すでにアカウントをお持ちの方は ";
    $("switchLink").textContent = "ログイン";
  } else {
    $("submitBtn").textContent = "ログイン";
    $("switchText").textContent = "アカウントをお持ちの方は ";
    $("switchLink").textContent = "新規登録";
  }
  setMsg("");
});

function setMsg(text, type=""){
  const el = $("authMsg");
  el.textContent = text;
  el.className = "auth-msg" + (type ? " "+type : "");
}

$("switchLink").addEventListener("click", () => {
  $("forgotRow").style.display = mode === "signup" ? "none" : "block";
});

$("forgotLink").addEventListener("click", async () => {
  if (!configOK) { setMsg("先に Firebase の設定を入力してください。", "err"); return; }
  const email = $("email").value.trim();
  if (!email) { setMsg("再設定メールを送る先のメールアドレスを入力してから押してください。", "err"); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    setMsg("パスワード再設定用のメールを送信しました。受信トレイ（迷惑メールも）をご確認ください。", "ok");
  } catch (err) {
    setMsg(friendlyError(err.code), "err");
  }
});

$("submitBtn").addEventListener("click", doAuth);
$("password").addEventListener("keydown", e => { if(e.key==="Enter") doAuth(); });

async function doAuth(){
  if (!configOK){ setMsg("先に Firebase の設定を入力してください。", "err"); return; }
  const email = $("email").value.trim();
  const pass  = $("password").value;
  if (!email || !pass){ setMsg("メールとパスワードを入力してください。", "err"); return; }

  $("submitBtn").disabled = true;
  setMsg(mode==="signup" ? "登録中..." : "ログイン中...");
  try {
    if (mode === "signup") {
      await createUserWithEmailAndPassword(auth, email, pass);
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
  } catch (err) {
    setMsg(friendlyError(err.code), "err");
  } finally {
    $("submitBtn").disabled = false;
  }
}

function friendlyError(code){
  const map = {
    "auth/invalid-email":"メールアドレスの形式が正しくありません。",
    "auth/user-not-found":"アカウントが見つかりません。新規登録をお試しください。",
    "auth/wrong-password":"パスワードが正しくありません。",
    "auth/invalid-credential":"メールまたはパスワードが正しくありません。",
    "auth/email-already-in-use":"このメールは既に登録済みです。ログインしてください。",
    "auth/weak-password":"パスワードは6文字以上にしてください。",
    "auth/too-many-requests":"試行回数が多すぎます。少し時間をおいてください。",
  };
  return map[code] || ("エラー: " + code);
}

$("logoutBtn").addEventListener("click", () => signOut(auth));

/* ============================================================
   ログイン状態の監視 → データ読み込み
   ============================================================ */
let data = blankData();
let currentUid = null;

if (configOK){
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUid = user.uid;
      $("authView").classList.add("hidden");
      $("appView").classList.remove("hidden");
      $("userChip").textContent = "👤 " + (user.email || "ログイン中");
      await loadData();
      render();
    } else {
      currentUid = null;
      data = blankData();
      $("appView").classList.add("hidden");
      $("authView").classList.remove("hidden");
      $("password").value = "";
      setMsg("");
    }
  });
}

async function loadData(){
  data = blankData();
  try {
    const ref = doc(db, "users", currentUid, "habits", "data");
    const snap = await getDoc(ref);
    if (snap.exists()){
      const saved = snap.data().habits || {};
      CATEGORIES.forEach(c => {
        if (Array.isArray(saved[c.key])) data[c.key] = saved[c.key];
      });
    }
  } catch(e){ console.error("load error", e); }
}

let saveTimer = null;
function saveData(){
  if (!currentUid) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      const ref = doc(db, "users", currentUid, "habits", "data");
      await setDoc(ref, { habits: data, updatedAt: Date.now() });
      flashSaved();
    } catch(e){ console.error("save error", e); }
  }, 500);
}

function flashSaved(){
  const dot = $("saveDot");
  dot.classList.add("show");
  setTimeout(()=>dot.classList.remove("show"), 1400);
}

/* ============================================================
   描画
   ============================================================ */
function uid(){ return "h"+Date.now()+Math.random().toString(36).slice(2,6); }

function render(){
  const boards = $("boards");
  boards.innerHTML = "";

  // グループ単位で見出しを出す
  let lastGroup = null;
  let cardsWrap = null;

  CATEGORIES.forEach((cat, idx) => {
    if (cat.group !== lastGroup){
      const gl = document.createElement("div");
      gl.className = "group-label" + (idx===0 ? " first-group":"");
      gl.textContent = cat.group;
      boards.appendChild(gl);
      cardsWrap = document.createElement("div");
      cardsWrap.className = "cards";
      boards.appendChild(cardsWrap);
      lastGroup = cat.group;
    }
    cardsWrap.appendChild(buildCard(cat));
  });
}

function buildCard(cat){
  const list = data[cat.key];
  const card = document.createElement("div");
  card.className = "card";
  card.style.setProperty("--c", `var(${cat.color})`);
  card.style.setProperty("--c-bg", `var(${cat.bg})`);

  // ヘッダー
  const head = document.createElement("div");
  head.className = "card-head";
  head.innerHTML = `
    <div class="card-emoji">${cat.emoji}</div>
    <div class="card-title">${cat.label}</div>
    <div class="card-count">${list.length}件</div>`;
  card.appendChild(head);

  // リスト
  const ul = document.createElement("div");
  ul.className = "habit-list";
  if (list.length === 0){
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "まだ習慣がありません";
    ul.appendChild(e);
  }
  list.forEach((h, i) => ul.appendChild(buildHabit(cat, h, i, list.length)));
  makeSortable(ul, cat.key);
  card.appendChild(ul);

  // 追加行
  const addRow = document.createElement("div");
  addRow.className = "add-row";
  const input = document.createElement("input");
  input.className = "add-input";
  input.placeholder = "習慣を追加…";
  const addBtn = document.createElement("button");
  addBtn.className = "add-btn";
  addBtn.textContent = "＋";
  const add = () => {
    const t = input.value.trim();
    if (!t) return;
    data[cat.key].push({ id: uid(), text: t, done: false });
    input.value = "";
    saveData();
    render();
  };
  addBtn.addEventListener("click", add);
  input.addEventListener("keydown", e => { if(e.key==="Enter") add(); });
  addRow.appendChild(input);
  addRow.appendChild(addBtn);
  card.appendChild(addRow);

  return card;
}

function buildHabit(cat, h, idx, total){
  const row = document.createElement("div");
  row.className = "habit" + (h.done ? " done":"");
  row.dataset.id = h.id;

  const check = document.createElement("div");
  check.className = "check" + (h.done ? " on":"");
  check.addEventListener("click", () => {
    h.done = !h.done;
    saveData();
    render();
  });

  const text = document.createElement("input");
  text.className = "habit-text";
  text.value = h.text;
  text.addEventListener("input", () => { h.text = text.value; saveData(); });

  // ドラッグ用のつまみ
  const handle = document.createElement("div");
  handle.className = "drag-handle";
  handle.textContent = "⠿";
  handle.title = "ドラッグして並べ替え";

  // 並べ替えボタン（上へ／下へ）
  const moveCol = document.createElement("div");
  moveCol.className = "move-col";
  const up = document.createElement("button");
  up.className = "move"; up.textContent = "▲"; up.title = "上へ";
  up.disabled = idx === 0;
  up.addEventListener("click", () => moveItem(cat, h.id, -1));
  const down = document.createElement("button");
  down.className = "move"; down.textContent = "▼"; down.title = "下へ";
  down.disabled = idx === total - 1;
  down.addEventListener("click", () => moveItem(cat, h.id, 1));
  moveCol.appendChild(up);
  moveCol.appendChild(down);

  const del = document.createElement("button");
  del.className = "del";
  del.textContent = "×";
  del.addEventListener("click", () => {
    data[cat.key] = data[cat.key].filter(x => x.id !== h.id);
    saveData();
    render();
  });

  row.appendChild(handle);
  row.appendChild(check);
  row.appendChild(text);
  row.appendChild(moveCol);
  row.appendChild(del);
  return row;
}

function makeSortable(listEl, catKey){
  listEl.querySelectorAll(".habit").forEach(row => {
    const handle = row.querySelector(".drag-handle");
    if (!handle) return;
    handle.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      row.classList.add("dragging");

      const onMove = (ev) => {
        const others = [...listEl.querySelectorAll(".habit:not(.dragging)")];
        let next = null;
        for (const r of others) {
          const box = r.getBoundingClientRect();
          if (ev.clientY < box.top + box.height / 2) { next = r; break; }
        }
        if (next) listEl.insertBefore(row, next);
        else listEl.appendChild(row);
      };
      const onUp = () => {
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        document.removeEventListener("pointercancel", onUp);
        row.classList.remove("dragging");
        const ids = [...listEl.querySelectorAll(".habit")].map(r => r.dataset.id);
        data[catKey].sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
        saveData();
        render();
      };
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onUp);
    });
  });
}

function moveItem(cat, id, dir){
  const arr = data[cat.key];
  const i = arr.findIndex(x => x.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return;
  const tmp = arr[i];
  arr[i] = arr[j];
  arr[j] = tmp;
  saveData();
  render();
}

/* ============================================================
   Excel出力（SheetJS）
   ============================================================ */
$("excelBtn").addEventListener("click", exportExcel);

function exportExcel(){
  const rows = [["カテゴリー", "習慣", "状態"]];
  CATEGORIES.forEach(cat => {
    const list = data[cat.key];
    if (list.length === 0){
      rows.push([cat.label, "", ""]);
    } else {
      list.forEach(h => {
        rows.push([cat.label, h.text, h.done ? "✓ 達成" : "未"]);
      });
    }
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws["!cols"] = [{ wch:14 }, { wch:46 }, { wch:10 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "習慣一覧");

  const d = new Date();
  const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
  XLSX.writeFile(wb, `習慣リスト_${stamp}.xlsx`);
}
